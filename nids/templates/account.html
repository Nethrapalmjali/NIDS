<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>NIDS · Account</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head>
<body>
<header>
  <span class="brand">&gt;_ NIDS</span><a href="{{ url_for('dashboard') }}">← Dashboard</a>
  <span class="grow"></span><span class="who">{{ user.username }} · {{ user.role }}</span>
</header>
<main class="admin">
  <section class="panel login">
    <h2>Change password</h2>
    {% if msg %}<p class="ok">{{ msg }}</p>{% endif %}
    {% if err %}<p class="error">{{ err }}</p>{% endif %}
    <form method="post">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label>Current password<input name="current" type="password" required autocomplete="current-password"></label>
      <label>New password (10+ chars)<input name="new" type="password" minlength="10" required autocomplete="new-password"></label>
      <label>Confirm new password<input name="confirm" type="password" minlength="10" required autocomplete="new-password"></label>
      <button>Change password</button>
    </form>
  </section>
</main>
</body>
</html>
