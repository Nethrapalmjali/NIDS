<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>NIDS · Sign in</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head>
<body>
<div class="panel login">
  <p class="brand mono ok">&gt;_ NIDS</p>
  <h2>Analyst sign-in</h2>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" autocomplete="off">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label>Username<input name="username" maxlength="64" required autofocus></label>
    <label>Password<input name="password" type="password" maxlength="256" required></label>
    <button type="submit">Sign in</button>
  </form>
</div>
</body>
</html>
