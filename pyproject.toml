[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nids"
version = "1.0.0"
description = "ML-based Network Intrusion Detection System trained on CIC-IDS2017, with a real-time dashboard"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==2.5.5", "pandas==3.1.1", "scipy==1.18.1", "scikit-learn==1.9.1",
  "lightgbm==4.7.0", "xgboost==3.4.1", "catboost==1.2.10", "joblib==1.6.0",
  "flask==3.1.3", "flask-login==0.6.3", "werkzeug==3.1.9", "waitress==3.0.2",
  "psutil==7.2.2", "scapy==2.8.0",
]

[project.scripts]
nids = "nids.app:main"

[tool.setuptools]
packages = ["nids"]

[tool.setuptools.package-data]
nids = ["models/*", "static/*", "templates/*"]
