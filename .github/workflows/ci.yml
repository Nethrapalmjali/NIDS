name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pyflakes
      - name: Lint
        run: python -m pyflakes nids tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Model and environment check
        run: |
          python -m nids.app check || true
          python -c "from nids.detector import Detector; d = Detector(); assert not d.version_warnings, d.version_warnings; print('models OK')"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t nids:ci .
      - name: Initialise and start container
        run: |
          docker volume create nids-ci
          docker run --rm -v nids-ci:/data -e NIDS_ADMIN_PASSWORD=ci-password-123 nids:ci init
          docker run -d --name nids -p 5000:5000 -v nids-ci:/data --read-only --tmpfs /tmp --cap-drop ALL nids:ci
      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5000/readyz; then echo; exit 0; fi
            sleep 2
          done
          docker logs nids
          exit 1
      - name: Smoke test
        run: |
          curl -fsS http://127.0.0.1:5000/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5000/api/stats)" = "401"
          docker logs nids 2>&1 | tail -n 20
